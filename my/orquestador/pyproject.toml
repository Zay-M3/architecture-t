[project]
name = "orquestador"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.27.0",
    "alembic>=1.18",
    "sqlalchemy>=2.0.51",
    "psycopg2-binary>=2.9.12",
]

[dependency-groups]
dev = ["grpcio-tools>=1.66", "ruff>=0.7"]

[project.scripts]
oc = "cli:app"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["cli.py", "config.py"]

[tool.ruff]
line-length = 100
target-version = "py314"
