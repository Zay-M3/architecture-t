# Cadena ÚNICA de migraciones para toda la plataforma.
# Se opera desde el CLI:  oc db upgrade / oc db revision -m "..." / oc db heads
#
# sqlalchemy.url NO se pone acá: lo inyecta env.py desde DATABASE_URL, para que no haya
# credenciales en un archivo versionado.

[alembic]
script_location = alembic
prepend_sys_path = .
# Prefijo con fecha: hace obvio el orden al mirar la carpeta
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
# Formatear las migraciones generadas con el mismo ruff que el resto
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
