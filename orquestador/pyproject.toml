[project]
name = "orquestador"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
]

[dependency-groups]
dev = ["grpcio-tools>=1.66", "ruff>=0.7"]

[project.scripts]
oc = "cli:app"

[tool.ruff]
line-length = 100
target-version = "py312"
